name: Automated API Testing with Newman

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn từ Repository (Dùng v4)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js (Dùng v4)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Cài đặt Newman & Báo cáo HTMLExtra
      - name: Install Newman & Reporters
        run: |
          npm install -g newman newman-reporter-htmlextra

      # 4. Chạy Test Suite tự động bằng Newman
      - name: Run Postman Tests with Newman
        run: |
          newman run *.postman_collection.json \
            -e *.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/report.html

      # 5. Xuất và lưu Báo cáo kết quả HTML (Dùng v4)
      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: newman/report.html
